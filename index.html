<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Домашка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c11;--card:#10131a;--card2:#161a23;--line:rgba(255,255,255,.08);--tx:#e9ecf3;--mut:#8d95a8;--acc:#7c5cff;--acc2:#a18bff;--ok:#3ddc97;--bad:#ff6b7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,rgba(124,92,255,.12),transparent),var(--bg);color:var(--tx);font:500 14px/1.45 Manrope,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;font-weight:600;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
.nav{display:flex;align-items:center;gap:6px;margin:0 auto 22px;width:max-content;max-width:100%;overflow-x:auto;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:0 0 20px 20px}
.logo{font-family:Unbounded;font-weight:600;font-size:18px;margin-right:14px;display:flex;gap:8px;align-items:center}
.logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--acc);font-style:normal;font-size:16px}
.nav button{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 22px;margin-bottom:16px}
.head h1{font-size:22px;display:flex;gap:10px;align-items:center}
.ok-ic{color:var(--ok);display:inline-flex}.ok-ic .i{width:26px;height:26px}
.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.big .i{width:46px;height:46px;stroke-width:1.4;color:var(--acc2)}
.btn{font:600 13px Manrope,sans-serif;color:var(--tx);background:transparent;border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:.15s}
.btn:hover{background:var(--card2);border-color:rgba(255,255,255,.16)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#6d4cf0}
.btn.good{color:var(--ok);border-color:rgba(61,220,151,.35)}
.btn.good:hover{background:rgba(61,220,151,.1)}
.btn.bad:hover{color:var(--bad);border-color:rgba(255,107,122,.4)}
.pill{font-size:12px;background:rgba(255,255,255,.08);border-radius:8px;padding:1px 8px;font-weight:700;margin-left:4px}
.grid{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.side{padding:14px}
.side small{display:block;color:var(--mut);font-size:12px;margin:10px 8px 6px}
.side a{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;color:var(--mut);cursor:pointer;border:1px solid transparent}
.side a:hover{color:var(--tx)}
.side a.on{background:var(--card2);border-color:var(--line);color:var(--tx)}
.side a.on span:first-child{color:var(--ok)}
.side a .pill{margin-left:auto;background:var(--acc);color:#fff}
.box{padding:18px 22px;margin-bottom:16px}
.box p{color:var(--mut);margin:4px 0 12px;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;background:transparent;color:var(--tx);font-family:inherit}
.chip:hover{border-color:var(--acc2)}
.chip.on{background:rgba(124,92,255,.15);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
input,select,textarea{font:500 14px Manrope,sans-serif;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.bar input{flex:1;min-width:160px;width:auto}.bar select{width:auto}
.task{display:flex;gap:14px;align-items:center;padding:14px 18px;margin-bottom:10px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.task .main{flex:1;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--acc2);background:rgba(124,92,255,.14);border-radius:8px;padding:2px 9px;margin-bottom:5px}
.task .tx{word-break:break-word;white-space:pre-wrap}
.due{font-size:12px;color:var(--mut);margin-top:4px}.due.late{color:var(--bad)}.due.soon{color:#ffc857}
.done .tx{text-decoration:line-through;color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}
.empty h3{color:var(--tx);font-size:15px;margin:8px 0 4px}
.empty .big{font-size:34px}
.prog{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));transition:.4s}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.day{padding:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.day.today{border-color:var(--ok)}
.day h3{font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between}
.day h3 em{font-style:normal;font-size:11px;color:var(--ok);font-family:Manrope}
.day .chip{display:flex;width:100%;margin-bottom:6px;justify-content:space-between}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.dlg{width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:22px}
.dlg h2{font-size:18px;margin-bottom:14px}
.dlg label{display:block;color:var(--mut);font-size:12px;margin:12px 0 6px}
.dlg textarea{min-height:96px;resize:vertical}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.hint{color:var(--mut);font-size:12px;margin-top:6px}
#pv{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.th{position:relative}.th img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--tx);cursor:pointer;display:grid;place-items:center;padding:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
@media(max-width:820px){.grid{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;gap:6px;padding:10px}.side small{display:none}.side a{white-space:nowrap}.task{flex-wrap:wrap}.acts{width:100%;justify-content:flex-start}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M14 6l4 4"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2.2 2.2L15 10"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 9h6M9 13h6M9 17h3"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 8h-3"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
<symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></symbol>
</defs></svg>
<div class="wrap">
  <div class="nav">
    <div class="logo"><i><svg class="i"><use href="#i-pen"/></svg></i>Домашка</div>
    <button class="btn" onclick="setView('active')"><svg class="i"><use href="#i-home"/></svg> Задания</button>
    <button class="btn" onclick="setView('done')"><svg class="i"><use href="#i-check"/></svg> Сделанные</button>
    <button class="btn" onclick="setView('schedule')"><svg class="i"><use href="#i-cal"/></svg> Расписание</button>
  </div>

  <div class="card head">
    <h1><span class="ok-ic"><svg class="i"><use href="#i-shield"/></svg></span><span id="title">Мои задания</span></h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="openSched()"><svg class="i"><use href="#i-cal"/></svg> Составить расписание</button>
      <button class="btn pri" onclick="openAdd()"><svg class="i"><use href="#i-plus"/></svg> Добавить дз</button>
    </div>
  </div>

  <div class="grid">
    <aside class="card side">
      <small>Разделы</small>
      <a data-v="active" onclick="setView('active')"><span><svg class="i"><use href="#i-list"/></svg></span>Активные<span class="pill" id="cA">0</span></a>
      <a data-v="done" onclick="setView('done')"><span><svg class="i"><use href="#i-check"/></svg></span>Сделанные<span class="pill" id="cD" style="background:var(--card2)">0</span></a>
      <a data-v="schedule" onclick="setView('schedule')"><span><svg class="i"><use href="#i-cal"/></svg></span>Расписание</a>
    </aside>
    <main id="main"></main>
  </div>
</div>

<div class="modal" id="mAdd"><div class="card dlg">
  <h2>Новое домашнее задание</h2>
  <label>Предмет</label>
  <select id="fSub" onchange="document.getElementById('fCustom').style.display=this.value==='__c'?'block':'none'"></select>
  <input id="fCustom" placeholder="Впиши свой предмет" style="display:none;margin-top:8px">
  <label>Задание</label>
  <textarea id="fText" placeholder="Например: §12, упр. 3–5"></textarea>
  <label>Срок сдачи (необязательно)</label>
  <input type="date" id="fDue">
  <label>Фото (необязательно, до 6 шт.)</label>
  <button class="btn" type="button" onclick="document.getElementById('fPic').click()"><svg class="i"><use href="#i-img"/></svg> Прикрепить фото</button>
  <input type="file" id="fPic" accept="image/*" multiple hidden onchange="addPhotos(this)">
  <div id="pv"></div>
  <div class="row"><button class="btn" onclick="closeM('mAdd')">Отмена</button><button class="btn pri" onclick="addTask()">Добавить</button></div>
</div></div>

<div class="modal" id="mImg"><img id="bigImg" alt="" style="max-width:100%;max-height:90vh;border-radius:14px"></div>
<div class="modal" id="mSch"><div class="card dlg">
  <h2>Составить расписание</h2>
  <label>Дата</label><input type="date" id="sDate" onchange="fillSched()">
  <div class="chips" style="margin-top:8px"><button class="chip" onclick="setSDate(0)">Сегодня</button><button class="chip" onclick="setSDate(1)">Завтра</button><button class="chip" onclick="setSDate(2)">Послезавтра</button></div>
  <label>Предметы на этот день</label>
  <textarea id="sText" style="min-height:150px" placeholder="Математика&#10;Русский язык&#10;Физика"></textarea>
  <div class="hint">По одному в строке или через запятую.</div>
  <div class="row"><button class="btn" onclick="closeM('mSch')">Отмена</button><button class="btn pri" onclick="saveSched()">Сохранить</button></div>
</div></div>

<script>
const DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const KEYS=['пн','вт','ср','чт','пт','сб','вс'];
const BASE=['Математика','Русский язык','Литература','Английский','Физика','Химия','Биология','История','География','Информатика'];
let S={tasks:[],sched:{},raw:''},view='active',q='',fs='',pend=[];
try{const r=localStorage.getItem('hw_v1');if(r)S=JSON.parse(r)}catch(e){}
if(Object.keys(S.sched||{}).some(k=>!/^\d{4}-\d\d-\d\d$/.test(k)))S.sched={};
const save=()=>{try{localStorage.setItem('hw_v1',JSON.stringify(S))}catch(e){alert('В браузере не хватило места для данных. Удали часть старых заданий с фото.')}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const subjects=()=>[...new Set([...Object.values(S.sched).flat(),...BASE,...S.tasks.map(t=>t.sub)])].sort((a,b)=>a.localeCompare(b,'ru'));
const dayIdx=d=>(d.getDay()+6)%7;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const plusDays=n=>{const t=new Date();t.setDate(t.getDate()+n);return t};
const dlabel=s=>{const x=new Date(s+'T00:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});return x[0].toUpperCase()+x.slice(1)};
const tag=s=>s===iso(new Date())?'<em>сегодня</em>':s===iso(plusDays(1))?'<em>завтра</em>':'';
function setSDate(n){document.getElementById('sDate').value=iso(plusDays(n));fillSched()}
function fillSched(){const d=document.getElementById('sDate').value;document.getElementById('sText').value=(S.sched[d]||[]).join('\n')}
function delSched(d){delete S.sched[d];save();render()}

function setView(v){view=v;render()}
function closeM(id){document.getElementById(id).classList.remove('show')}
function openAdd(pre,due){
  const sel=document.getElementById('fSub');
  sel.innerHTML=subjects().map(s=>`<option ${s===pre?'selected':''}>${esc(s)}</option>`).join('')+'<option value="__c">Свой предмет…</option>';
  document.getElementById('fCustom').style.display='none';
  document.getElementById('fCustom').value='';document.getElementById('fText').value='';document.getElementById('fDue').value=due||'';pend=[];renderPend();
  document.getElementById('mAdd').classList.add('show');
  setTimeout(()=>document.getElementById('fText').focus(),50);
}
function addTask(){
  let sub=document.getElementById('fSub').value;
  if(sub==='__c')sub=document.getElementById('fCustom').value.trim();
  const text=document.getElementById('fText').value.trim();
  if(!sub||(!text&&!pend.length)){alert('Укажи предмет и впиши задание или прикрепи фото');return}
  S.tasks.unshift({id:Date.now(),sub,text,due:document.getElementById('fDue').value,done:false,imgs:pend});pend=[];
  save();closeM('mAdd');view='active';render();
}
function openSched(d){document.getElementById('sDate').value=d||iso(plusDays(1));fillSched();document.getElementById('mSch').classList.add('show')}
function saveSched(){
  const d=document.getElementById('sDate').value;
  if(!d){alert('Выбери дату');return}
  const list=document.getElementById('sText').value.split(/[\n,;]/).map(s=>s.trim().replace(/^\d+[.)]\s*/,'')).filter(Boolean).map(s=>s[0].toUpperCase()+s.slice(1));
  if(!list.length){alert('Впиши хотя бы один предмет');return}
  S.sched[d]=list;save();closeM('mSch');view='schedule';render();
}
function addPhotos(inp){
  [...inp.files].slice(0,6-pend.length).forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      pend.push(c.toDataURL('image/jpeg',.72));renderPend()};im.src=r.result};
    r.readAsDataURL(f)});
  inp.value='';
}
function renderPend(){document.getElementById('pv').innerHTML=pend.map((s,i)=>`<div class="th"><img src="${s}" alt=""><button type="button" onclick="rmPend(${i})"><svg class="i"><use href="#i-x"/></svg></button></div>`).join('')}
function rmPend(i){pend.splice(i,1);renderPend()}
function openImg(id,i){const t=S.tasks.find(t=>t.id===id);if(!t||!t.imgs)return;document.getElementById('bigImg').src=t.imgs[i];document.getElementById('mImg').classList.add('show')}
const thumbs=t=>(t.imgs&&t.imgs.length)?`<div class="thumbs">${t.imgs.map((s,i)=>`<img src="${s}" alt="" onclick="openImg(${t.id},${i})">`).join('')}</div>`:'';
function doneTask(id,v){const t=S.tasks.find(t=>t.id===id);if(t){t.done=v;save();render()}}
function delTask(id){S.tasks=S.tasks.filter(t=>t.id!==id);save();render()}

function dueInfo(d){
  if(!d)return '';
  const t=new Date();t.setHours(0,0,0,0);const diff=Math.round((new Date(d+'T00:00:00')-t)/864e5);
  const fmt=new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  if(diff<0)return `<div class="due late">Просрочено · ${fmt}</div>`;
  if(diff===0)return `<div class="due soon">Сдать сегодня</div>`;
  if(diff===1)return `<div class="due soon">Сдать завтра</div>`;
  return `<div class="due">Срок: ${fmt}</div>`;
}
function taskHTML(t){
  const acts=t.done
   ?`<button class="btn" onclick="doneTask(${t.id},false)"><svg class="i"><use href="#i-undo"/></svg> Вернуть</button><button class="btn bad" onclick="delTask(${t.id})"><svg class="i"><use href="#i-x"/></svg></button>`
   :`<button class="btn good" onclick="doneTask(${t.id},true)"><svg class="i"><use href="#i-check"/></svg> Сделал дз</button><button class="btn bad" onclick="delTask(${t.id})"><svg class="i"><use href="#i-x"/></svg></button>`;
  return `<div class="task ${t.done?'done':''}"><div class="main"><span class="tag">${esc(t.sub)}</span>${t.text?`<div class="tx">${esc(t.text)}</div>`:''}${thumbs(t)}${t.done?'':dueInfo(t.due)}</div><div class="acts">${acts}</div></div>`;
}
function render(){
  const act=S.tasks.filter(t=>!t.done),dn=S.tasks.filter(t=>t.done);
  document.getElementById('cA').textContent=act.length;document.getElementById('cD').textContent=dn.length;
  document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  document.getElementById('title').textContent={active:'Мои задания',done:'Сделанные',schedule:'Расписание'}[view];
  const m=document.getElementById('main');
  if(view==='schedule'){
    const tdy=iso(new Date()),dates=Object.keys(S.sched).filter(d=>d>=tdy).sort();
    if(!dates.length){m.innerHTML=`<div class="card empty"><div class="big"><svg class="i"><use href="#i-cal"/></svg></div><h3>Расписания пока нет</h3>Выбери дату и впиши предметы на этот день<br><br><button class="btn pri" onclick="openSched()">Составить расписание</button></div>`;return}
    m.innerHTML=`<div class="card box"><h3 style="font-size:16px">Расписание по датам</h3><p>Нажми на предмет, чтобы сразу добавить по нему дз.</p><div class="days">`+
      dates.map(i=>{const d=dlabel(i);return S.sched[i]?`<div class="day ${i===tdy?'today':''}"><h3><span>${d}</span><span style="display:flex;gap:6px;align-items:center">${tag(i)}<button class="btn" style="padding:4px 7px" onclick="openSched('${i}')"><svg class="i"><use href="#i-pen"/></svg></button><button class="btn bad" style="padding:4px 7px" onclick="delSched('${i}')"><svg class="i"><use href="#i-x"/></svg></button></span></h3>${S.sched[i].map((s,n)=>`<button class="chip" onclick="openAdd('${esc(s).replace(/'/g,"\\'")}','${i}')"><span>${esc(s)}</span><span style="color:var(--mut)">${n+1}</span></button>`).join('')}</div>`:''}).join('')+
      `</div><div style="margin-top:14px"><button class="btn" onclick="openSched()"><svg class="i"><use href="#i-plus"/></svg> Добавить день</button></div></div>`;
    return;
  }
  const list=(view==='done'?dn:act).filter(t=>(!fs||t.sub===fs)&&(!q||(t.text+t.sub).toLowerCase().includes(q.toLowerCase())));
  let top='';
  if(view==='active'){
    const tm=new Date();tm.setDate(tm.getDate()+1);const ts=S.sched[iso(tm)];
    const total=S.tasks.length,pc=total?Math.round(dn.length/total*100):0;
    top=`<div class="card box"><h3 style="font-size:15px">Прогресс</h3><p>Сделано ${dn.length} из ${total} · ${pc}%</p><div class="prog"><i style="width:${pc}%"></i></div></div>`;
    if(ts)top+=`<div class="card box"><h3 style="font-size:15px">Завтра по расписанию</h3><p>Нажми на предмет, чтобы записать дз.</p><div class="chips">${ts.map(s=>`<button class="chip" onclick="openAdd('${esc(s).replace(/'/g,"\\'")}','${iso(tm)}')">${esc(s)}</button>`).join('')}</div></div>`;
  }
  const used=[...new Set((view==='done'?dn:act).map(t=>t.sub))];
  const bar=`<div class="bar"><input id="qs" placeholder="Поиск по заданиям…" value="${esc(q)}" oninput="q=this.value;renderList()"><select onchange="fs=this.value;render()"><option value="">Все предметы</option>${used.map(s=>`<option ${s===fs?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`;
  m.innerHTML=top+bar+`<div id="list"></div>`;renderList();
}
function renderList(){
  const act=S.tasks.filter(t=>t.done===(view==='done'));
  const list=act.filter(t=>(!fs||t.sub===fs)&&(!q||(t.text+t.sub).toLowerCase().includes(q.toLowerCase())));
  document.getElementById('list').innerHTML=list.length?list.map(taskHTML).join(''):
   `<div class="empty"><div class="big"><svg class="i"><use href="#${view==='done'?'i-folder':'i-ok'}"/></svg></div><h3>${view==='done'?'В папке пока пусто':'Заданий нет'}</h3>${view==='done'?'Здесь будет всё, что ты уже сделал':'Нажми «Добавить дз», чтобы записать первое'}</div>`;
}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')}));
render();
</script>
</body>
</html>
